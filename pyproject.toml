[project]
name = "rubies-mfb-agent"
version = "0.1.0"
description = "Rubies MFB Customer Support Agent capstone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "jsonschema>=4.21,<5",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/agent",
    "apps/banking_api",
    "apps/loan_model",
    "apps/mcp_server",
    "packages/knowledge_base",
    "packages/observability",
    "packages/security",
    "packages/shared",
]

[tool.pytest.ini_options]
testpaths = [
    "docs/evaluation/evaluators/tests",
]
pythonpath = [
    "docs/evaluation/evaluators",
    "docs/evaluation/evaluators/adapters",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
