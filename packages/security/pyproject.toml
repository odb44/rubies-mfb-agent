[project]
name = "rubies-security"
version = "0.1.0"
description = "Rubies MFB security utilities"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.10,<3",
    "rubies-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_security"]

[tool.uv.sources]
rubies-shared = { workspace = true }
