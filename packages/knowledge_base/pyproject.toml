[project]
name = "rubies-knowledge-base"
version = "0.1.0"
description = "Knowledge retrieval and policy citations for Rubies MFB"
requires-python = ">=3.11"
dependencies = [
    "rubies-shared",
    "numpy>=2.0,<3.0",
    "sentence-transformers>=5.0,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_knowledge_base"]

[tool.uv.sources]
rubies-shared = { workspace = true }
