[project]
name = "rubies-agent"
version = "0.1.0"
description = "Customer support agent for Rubies MFB"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol>=1.0.0,<2",
    "ag-ui-strands>=1.0.2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "rubies-knowledge-base",
    "rubies-mcp-server",
    "rubies-observability",
    "rubies-shared",
    "strands-agents>=1.55.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_agent"]

[tool.uv.sources]
rubies-knowledge-base = { workspace = true }
rubies-mcp-server = { workspace = true }
rubies-observability = { workspace = true }
rubies-shared = { workspace = true }
