[project]
name = "rubies-loan-model"
version = "0.1.0"
description = "Loan model inference and evaluation for Rubies MFB"
requires-python = ">=3.11"
dependencies = [
    "rubies-shared",
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_loan_model"]

[tool.uv.sources]
rubies-shared = { workspace = true }