[project]
name = "rubies-loan-model"
version = "0.1.0"
description = "Loan eligibility model for Rubies MFB"
requires-python = ">=3.11"
dependencies = [
    "rubies-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_loan_model"]

[tool.uv.sources]
rubies-shared = { workspace = true }
