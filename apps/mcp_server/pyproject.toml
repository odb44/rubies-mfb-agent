[project]
name = "rubies-mcp-server"
version = "0.1.0"
description = "MCP tools for controlled access to Rubies MFB services"
requires-python = ">=3.11"
dependencies = [
    "rubies-banking-api",
    "rubies-shared",
    "rubies-security",
    "mcp>=1.28,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubies_mcp_server"]

[tool.uv.sources]
rubies-banking-api = { workspace = true }
rubies-shared = { workspace = true }
rubies-security = { workspace = true }
